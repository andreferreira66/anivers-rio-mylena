<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parabéns! 🎉</title>
  <style>
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffd6e7, #c7d2fe, #a7f3d0);
      color:#0f172a;
    }
    .card{
      width:min(720px, 92vw);
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
    }
    h1{ margin:0 0 10px; font-size: clamp(28px, 4vw, 44px); }
    p{ margin: 10px 0; font-size: clamp(16px, 2.2vw, 19px); line-height:1.5; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    input{
      flex: 1 1 220px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,.15);
      outline: none;
      font-size: 16px;
      background: rgba(255,255,255,.9);
    }
    button{
      padding: 12px 16px;
      border:0;
      border-radius: 12px;
      background:#0f172a;
      color:#fff;
      font-weight: 700;
      cursor:pointer;
    }
    button:hover{ opacity:.92; }
    .small{ opacity:.75; font-size: 13px; margin-top: 8px; }
    .badge{
      display:inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15,23,42,.08);
      font-weight: 600;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">💌 Mensagem especial</div>
    <h1>Parabéns, <span id="nome">amiga</span>! 🎉</h1>

    <p id="msg">
      Que seu dia seja leve, feliz e cheio de coisa boa — e obrigado por ser essa amizade
      que chega com risada (e um humor meio duvidoso 😅) na hora certa.
    </p>

    <div class="row">
      <input id="inputNome" placeholder="Nome dela (ex: Ju)" />
      <input id="inputExtra" placeholder="Um detalhe (ex: 'minha dupla de risadas')" />
      <button onclick="atualizar()">Atualizar</button>
      <button onclick="copiarLink()">Copiar link</button>
    </div>

    <p class="small">
      Publique no GitHub Pages e compartilhe o link 💛
    </p>
  </div>

  <script>
    function atualizar(){
      const nome = document.getElementById("inputNome").value.trim();
      const extra = document.getElementById("inputExtra").value.trim();

      if(nome) document.getElementById("nome").textContent = nome;

      const base =
        "Que seu dia seja leve, feliz e cheio de coisa boa — e obrigado por ser essa amizade " +
        "que chega com risada (e um humor meio duvidoso 😅) na hora certa.";

      const final = extra ? base + " 💛 " + extra + "." : base;
      document.getElementById("msg").textContent = final;

      const params = new URLSearchParams();
      if(nome) params.set("nome", nome);
      if(extra) params.set("extra", extra);
      history.replaceState(null, "", "?" + params.toString());
    }

    (function init(){
      const p = new URLSearchParams(location.search);
      const nome = p.get("nome");
      const extra = p.get("extra");

      if(nome) document.getElementById("nome").textContent = nome;
      if(extra){
        document.getElementById("msg").textContent =
          "Que seu dia seja leve, feliz e cheio de coisa boa — e obrigado por ser essa amizade " +
          "que chega com risada (e um humor meio duvidoso 😅) na hora certa. 💛 " + extra + ".";
      }
    })();

    async function copiarLink(){
      const url = location.href;
      try{
        await navigator.clipboard.writeText(url);
        alert("Link copiado! Agora é só mandar pra ela 😄");
      }catch(e){
        prompt("Copia aqui:", url);
      }
    }
  </script>
</body>
</html>
